name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        # The views run without a window, against a fake server.
        run: go test ./...
      - name: Test for races
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Build the app
        run: go tool mygo build

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Every platform builds
        run: |
          for p in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} go build -o /dev/null . || exit 1
          done
